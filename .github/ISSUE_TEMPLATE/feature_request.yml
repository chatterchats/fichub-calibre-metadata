name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the feature and the user problem it solves.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What is difficult today?
      placeholder: "I cannot..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: "I would like the plugin to..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: "Other options I considered..."
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
    validations:
      required: false
