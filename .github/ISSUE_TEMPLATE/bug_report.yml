name: Bug report
description: Report a reproducible problem with the plugin
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please provide enough detail for us to reproduce the issue.
  - type: input
    id: calibre_version
    attributes:
      label: Calibre version
      description: Found in Help -> About Calibre
      placeholder: "Example: 7.26"
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      placeholder: "Example: 0.1.0"
    validations:
      required: true
  - type: input
    id: story_url
    attributes:
      label: Story URL
      description: URL used for metadata lookup
      placeholder: "https://archiveofourown.org/works/12345678"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Edit metadata
        2. Add identifier...
        3. Click Download metadata...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste relevant lines from Calibre logs
      render: shell
    validations:
      required: false
