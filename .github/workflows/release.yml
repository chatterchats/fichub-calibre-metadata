name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (example: v0.1.0). Leave empty when running from a tag push."
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$REF_NAME"
          fi

          if [ -z "$TAG" ]; then
            echo "No tag could be resolved."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Ensure tag exists
        run: |
          git rev-parse "refs/tags/${{ steps.tag.outputs.tag }}" >/dev/null

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare stripped plugin sources
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import shutil

          src_dir = pathlib.Path("calibre_plugin")
          build_dir = pathlib.Path("build/release_plugin")
          shutil.rmtree(build_dir, ignore_errors=True)
          build_dir.mkdir(parents=True, exist_ok=True)

          def strip_docstrings(node: ast.AST) -> ast.AST:
              for child in ast.walk(node):
                  if isinstance(child, (ast.Module, ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                      body = getattr(child, "body", None)
                      if body and isinstance(body[0], ast.Expr):
                          value = body[0].value
                          if isinstance(value, ast.Constant) and isinstance(value.value, str):
                              body.pop(0)
              return node

          for path in src_dir.iterdir():
              if path.is_dir():
                  continue
              target = build_dir / path.name
              if path.suffix != ".py":
                  shutil.copy2(path, target)
                  continue

              source = path.read_text(encoding="utf-8")
              tree = ast.parse(source, filename=str(path))
              tree = strip_docstrings(tree)
              stripped = ast.unparse(tree) + "\n"
              target.write_text(stripped, encoding="utf-8", newline="\n")
          PY

      - name: Build plugin ZIP
        run: |
          mkdir -p dist
          cd build/release_plugin
          zip -r ../../dist/FicHub_Metadata_Source.zip __init__.py main.py http.py metadata.py plugin-import-name-fichub.txt

      - name: Validate ZIP contents
        run: |
          python - <<'PY'
          import zipfile

          expected = {
              '__init__.py',
              'main.py',
              'http.py',
              'metadata.py',
              'plugin-import-name-fichub.txt',
          }
          with zipfile.ZipFile('dist/FicHub_Metadata_Source.zip') as zf:
              names = set(zf.namelist())

          missing = sorted(expected - names)
          if missing:
              raise SystemExit(f'Missing files in ZIP: {missing}')
          print('ZIP validated successfully')
          PY

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/FicHub_Metadata_Source.zip
