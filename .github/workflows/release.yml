name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (example: v0.1.0). Leave empty when running from a tag push."
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$REF_NAME"
          fi

          if [ -z "$TAG" ]; then
            echo "No tag could be resolved."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Ensure tag exists
        run: |
          git rev-parse "refs/tags/${{ steps.tag.outputs.tag }}" >/dev/null

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build plugin ZIP
        run: |
          mkdir -p dist
          cd calibre_plugin
          zip -r ../dist/FicHub_Metadata_Source.zip __init__.py main.py plugin-import-name-fichub.txt

      - name: Validate ZIP contents
        run: |
          python - <<'PY'
          import zipfile

          expected = {
              '__init__.py',
              'main.py',
              'plugin-import-name-fichub.txt',
          }
          with zipfile.ZipFile('dist/FicHub_Metadata_Source.zip') as zf:
              names = set(zf.namelist())

          missing = sorted(expected - names)
          if missing:
              raise SystemExit(f'Missing files in ZIP: {missing}')
          print('ZIP validated successfully')
          PY

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/FicHub_Metadata_Source.zip
