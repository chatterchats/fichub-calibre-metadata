[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fichub-calibre-metadata"
version = "0.1.0"
description = "Calibre metadata source plugin for fanfiction sites via the FicHub API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Chatterchats", email = "chats@irby.us" }
]
keywords = [
    "calibre",
    "fanfiction",
    "metadata",
    "fichub",
    "ao3",
    "fanfiction-net",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/chatterchats/fichub-calibre-metadata"
Repository = "https://github.com/chatterchats/fichub-calibre-metadata"
Issues = "https://github.com/chatterchats/fichub-calibre-metadata/issues"
Changelog = "https://github.com/chatterchats/fichub-calibre-metadata/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8.0",
    "prek>=0.3.8",
    "pyright>=1.1.408",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["calibre_plugin"]

[tool.hatch.build.targets.sdist]
include = [
    "/calibre_plugin",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/.pre-commit-config.yaml",
]

[tool.ruff]
line-length = 120
target-version = "py312"
required-version = ">=0.15.5,<0.16"
src = ["calibre_plugin", "tests"]
extend-exclude = ["dist", "__pycache__", "tests/stubs/**"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["calibre_plugin"]

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-config --strict-markers --cov=calibre_plugin --cov-branch --cov-report=term-missing:skip-covered --no-cov-on-fail"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["error"]
junit_family = "xunit2"
xfail_strict = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["calibre_plugin"]
exclude = [".venv", "dist", "__pycache__"]
executionEnvironments = [{ root = ".", extraPaths = ["tests/stubs"] }]
reportMissingModuleSource = false
reportMissingTypeStubs = false

[tool.coverage.run]
branch = true
source = ["calibre_plugin"]

[tool.coverage.report]
show_missing = true
skip_covered = false
sort = "Cover"

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.paths]
source = ["calibre_plugin", "*/site-packages/calibre_plugin"]
